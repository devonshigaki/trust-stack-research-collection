[project]
name = "trust-stack-research-collection"
version = "4.5.0"
description = "Reproducible formal verification, empirical connectomics/linguistics, and simulation suite for The Trust Stack research collection."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Devon Shigaki", email = "devon@freshcredit.xyz" }
]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "matplotlib>=3.9",
  "pandas>=2.2",
  "pyarrow>=16.0",
  "networkx>=3.3",
  "statsmodels>=0.14",
  "sympy>=1.14",
  "z3-solver>=4.13",
  "requests>=2.32",
  "pydantic>=2.8",
  "pillow>=10.4",
  "scikit-learn>=1.5",
  "cryptography>=43.0",
  "brainflow>=5.12",
  "mne>=1.8",
  "mne-nirs>=0.7",
  "rdkit>=2024.3",
  "h5py>=3.11",
]

[tool.ruff]
line-length = 110
target-version = "py312"
