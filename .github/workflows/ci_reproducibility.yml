name: Open Science Reproducibility & Formal Verification Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-trust-stack:
    name: Run Tier 1 (Formal & Sims) & Tier 2 (Public Data APIs) Suite
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy scipy sympy z3-solver networkx matplotlib pandas requests brian2

    - name: Run Tier 1 & Tier 2 Comprehensive Test Suite (19 Tasks)
      run: |
        python run_tier1_tier2_suite.py

    - name: Run Academic Network Graph Engine
      run: |
        python experiments/simulations_repair_era/outreach/build_academic_network_graph.py

    - name: Run Live Preprint Alert Pipeline
      run: |
        python experiments/simulations_repair_era/outreach/monitor_lab_preprints.py
